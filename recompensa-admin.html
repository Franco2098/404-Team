<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Recompensas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles2.css">
</head>
<body>

<header class="header">
        <div class="logo">📅 MySchedule</div>
        <div class="user-info" id="userMenuToggle">
            <div class="avatar">Ad</div>
            <div class="user-name-wrap">
                <span class="user-name">Admin</span>
                <div class="user-dropdown" id="userDropdown">
                    <a href="equipo404.html" class="dropdown-item" aria-label="Cerrar sesión">
                        <span class="item-icon">↪</span>
                        <span class="item-text">Cerrar sesión</span>
                    </a>
                </div>
            </div>
        </div>
    </header>

<nav class="nav-container">
    <ul class="nav-menu">
        <li class="nav-item">
            <a href="home_admin.html" class="nav-link">
                <span class="nav-icon">🕐</span>Horarios
            </a>
        </li>
        <li class="nav-item">
            <a href="Calendario-admin.html" class="nav-link">
                <span class="nav-icon">📅</span>Calendario
            </a>
        </li>
        <li class="nav-item">
            <a href="recompensa-admin.html" class="nav-link active">
                <span class="nav-icon">🏆</span>Recompensas
            </a>
        </li>
    </ul>
</nav>

<main class="main-content">
    <h2 class="section-title">Sistema de Recompensas</h2>

    <div class="rewards-container">

        <div class="reward-card">
            <h3>🎯 Puntualidad</h3>
            <p>+10 puntos por cada semana sin retrasos.</p>
            <div class="reward-actions">
                <button class="btn-edit">Editar</button>
                <button class="btn-delete">Eliminar</button>
            </div>
        </div>

        <div class="reward-card">
            <h3>🏅 Mejor empleado del mes</h3>
            <p>Reconocimiento y bonus especial.</p>
            <div class="reward-actions">
                <button class="btn-edit">Editar</button>
                <button class="btn-delete">Eliminar</button>
            </div>
        </div>

        <div class="reward-card">
            <h3>🎁 Bonus anual</h3>
            <p>Acumula 500 puntos para obtener premio.</p>
            <div class="reward-actions">
                <button class="btn-edit">Editar</button>
                <button class="btn-delete">Eliminar</button>
            </div>
        </div>

    </div>
</main>
<script>
    const toggle = document.getElementById("userMenuToggle");
    const dropdown = document.getElementById("userDropdown");

    toggle.addEventListener("click", function (e) {
        e.stopPropagation();
        dropdown.classList.toggle("show");
    });

    document.addEventListener("click", function () {
        dropdown.classList.remove("show");
    });
</script>
</body>
</html>
