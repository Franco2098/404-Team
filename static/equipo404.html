<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Vifraison</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h2>Iniciar sesión</h2>

    <form id="loginForm">
        <label for="usuario">Usuario (email):</label><br>
        <input type="text" id="usuario" placeholder="correo@ejemplo.com"><br><br>

        <label for="password">Contraseña:</label><br>
        <input type="password" id="password" placeholder="Contraseña"><br><br>
        <button type="submit" id="btnEntrar">Entrar</button>
    </form>

    <!-- Alert modal -->
    <div id="alertModal" class="alert-modal" role="alert" aria-live="assertive">
        <div class="alert-message" id="alertMsg">Por favor completa todos los campos</div>
        <button id="alertOk" class="alert-action">Aceptar</button>
    </div>

    <script>
        const API = '';  

        document.getElementById("loginForm").addEventListener("submit", async function(e) {
            e.preventDefault();

            const userEl = document.getElementById("usuario");
            const passEl = document.getElementById("password");
            const user   = (userEl.value || "").trim();
            const pass   = (passEl.value || "").trim();

            if (!user || !pass) {
                showAlert("Por favor completa todos los campos");
                return;
            }

            const btn = document.getElementById("btnEntrar");
            btn.disabled = true;
            btn.textContent = "Entrando…";

            try {
                const res  = await fetch(API + '/api/login', {
                    method:      'POST',
                    headers:     { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body:        JSON.stringify({ usuario: user, password: pass })
                });
                const data = await res.json();

                if (data.ok) {
                    // Guardar nombre para mostrarlo en el dashboard
                    sessionStorage.setItem('nombre', data.nombre);
                    sessionStorage.setItem('rol', data.rol);
                    window.location.href = data.rol === 'admin' ? 'home_admin.html' : 'home.html';
                } else {
                    showAlert(data.msg || "Credenciales incorrectas");
                }
            } catch (err) {
                showAlert("Error de conexión con el servidor");
            } finally {
                btn.disabled = false;
                btn.textContent = "Entrar";
            }
        });

        // ── Modal helpers ──────────────────────────────
        const alertModal = document.getElementById('alertModal');
        const alertOk    = document.getElementById('alertOk');

        function showAlert(msg) {
            document.getElementById('alertMsg').textContent = msg;
            alertModal.classList.add('show');
            alertOk.focus();
        }

        alertOk.addEventListener('click', () => alertModal.classList.remove('show'));
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') alertModal.classList.remove('show');
        });
    </script>
</body>
</html>
