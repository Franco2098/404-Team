<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Mapa</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles2.css">
</head>
<body>
    <header class="header">
        <div class="logo">📅 MySchedule</div>
        <div class="user-info" id="userMenuToggle">
            <div class="avatar" id="avatarEl">JD</div>
            <div class="user-name-wrap">
                <span class="user-name" id="nombreEl">Usuario</span>
                <div class="user-dropdown" id="userDropdown">
                    <a href="#" id="btnLogout" class="dropdown-item">
                        <span class="item-icon">↪</span>
                        <span class="item-text">Cerrar sesión</span>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <nav class="nav-container">
        <ul class="nav-menu">
            <li class="nav-item"><a href="mapa.html"        class="nav-link active"><span class="nav-icon">🗺️</span>Mapa</a></li>
            <li class="nav-item"><a href="home.html"        class="nav-link"><span class="nav-icon">🕐</span>Horarios</a></li>
            <li class="nav-item"><a href="Calendario.html"  class="nav-link"><span class="nav-icon">📅</span>Calendario</a></li>
            <li class="nav-item"><a href="recompensas.html" class="nav-link"><span class="nav-icon">🏆</span>Recompensas</a></li>
        </ul>
    </nav>

    <main class="main-content">
        <h2 class="section-title">Ubicación de la Empresa</h2>
        <div class="map-container">
            <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3124.0491040203557!2d-0.48218138468935195!3d38.34521907965825!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xd62370e674c1b3d%3A0x962b72d0451a5d5e!2sAvenida%20Ciudad%20Le%C3%B3n%20de%20Nicaragua%208%2C%2003002%20Alicante%2C%20Espa%C3%B1a!5e0!3m2!1ses!2ses!4v1708212345678!5m2!1ses!2ses"
                width="100%" height="450" style="border:0;" allowfullscreen loading="lazy">
            </iframe>
        </div>
    </main>

    <script>
    const nombre = sessionStorage.getItem('nombre') || 'Usuario';
    document.getElementById('nombreEl').textContent = nombre;
    document.getElementById('avatarEl').textContent  = nombre.slice(0,2).toUpperCase();

    const toggle   = document.getElementById("userMenuToggle");
    const dropdown = document.getElementById("userDropdown");
    toggle.addEventListener("click", e => { e.stopPropagation(); dropdown.classList.toggle("show"); });
    document.addEventListener("click", () => dropdown.classList.remove("show"));

    document.getElementById('btnLogout').addEventListener('click', async e => {
        e.preventDefault();
        await fetch('/api/logout', { method:'POST', credentials:'include' });
        sessionStorage.clear();
        window.location.href = 'equipo404.html';
    });
    </script>
</body>
</html>
